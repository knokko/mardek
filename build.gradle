buildscript {
	repositories {
		mavenCentral()
	}

	dependencies {
		classpath "com.guardsquare:proguard-gradle:7.8.2"
	}
}

plugins {
	id "java"
	alias(libs.plugins.kotlinJvm) apply false
}

allprojects {
	apply plugin: "java"

	java {
		withSourcesJar()
	}

	repositories {
		mavenCentral()

		maven {
			name = "knokko-reposilite"
			url = "https://49.12.188.159:8080/releases/"
			content {
				includeGroup "com.github.knokko"
				includeGroup "com.github.knokko.vk-compressor"
			}
		}

		// Used for LWJGL and JOML
		maven {
			name = "sonatype"
			url = "https://central.sonatype.com/repository/maven-snapshots"
			content {
				includeGroup "org.joml"
				includeGroup "org.lwjgl"
			}
		}
	}

	project.ext.lwjglNatives = [
			"natives-linux", "natives-linux-arm32", "natives-linux-arm64",
			"natives-linux-ppc64le", "natives-linux-riscv64", "natives-freebsd",
			"natives-windows", "natives-windows-x86", "natives-windows-arm64",
			"natives-macos", "natives-macos-arm64"
	]

	dependencies {
		implementation platform("org.lwjgl:lwjgl-bom:${libs.versions.lwjgl.get()}")
		testImplementation platform("org.junit:junit-bom:5.12.2")
		testImplementation "org.junit.jupiter:junit-jupiter:5.12.2"
		testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	}

	project.ext.vulkanImplementationDependencies = [
			"com.github.knokko:vk-boiler:${libs.versions.vk.boiler.get()}",
			"org.joml:joml:${libs.versions.joml.get()}",
			"org.lwjgl:lwjgl",
			"org.lwjgl:lwjgl-vulkan",
			"org.lwjgl:lwjgl-harfbuzz",
	]
	project.ext.vulkanRuntimeDependencies = project.ext.lwjglNatives.collectMany {
		def result = ["org.lwjgl:lwjgl::$it", ]
		if (it.startsWith("natives-macos")) result.add("org.lwjgl:lwjgl-vulkan::$it")
		result.add("org.lwjgl:lwjgl-harfbuzz::$it")
		result.add("org.lwjgl:lwjgl-zstd::$it")
		result
	}

	test {
		useJUnitPlatform()
		minHeapSize = "512m" // initial heap size
		maxHeapSize = "2g" // maximum heap size
	}
}
